<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alex Karaoke V2.1</title>

<meta name="description" content="Catalogue karaoké Alex Karaoke">

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#ff2f55">

</head>


<body>


<header class="header">

    <h1>
        🎤 Alex Karaoke
    </h1>

    <p>
        Catalogue karaoké V2.1
    </p>

</header>



<main>


<section class="search-zone">


<input 
    id="search"
    type="search"
    placeholder="🔍 Rechercher un titre ou un artiste..."
>



<div class="filters">


<select id="languageFilter">

<option value="">
🌍 Toutes les langues
</option>

</select>



<select id="styleFilter">

<option value="">
🎵 Tous les styles
</option>

</select>



<select id="artistFilter">

<option value="">
👤 Tous les artistes
</option>

</select>



</div>



<div class="options">


<label>

<input 
type="checkbox"
id="duoOnly"
>

👥 Duos uniquement

</label>



<label>

<input 
type="checkbox"
id="hideExplicit"
>

🚫 Masquer explicite

</label>


</div>



</section>





<section class="toolbar">


<div id="songCount">

0 chanson

</div>



<select id="sortSelect">


<option value="titleAsc">

A → Z

</option>


<option value="titleDesc">

Z → A

</option>


<option value="artist">

Artiste

</option>


<option value="yearAsc">

Année croissante

</option>


<option value="yearDesc">

Année décroissante

</option>


</select>


</section>





<section id="songs" class="songs-grid">


<!-- Les chansons seront générées ici -->


</section>





<nav id="pagination" class="pagination">


</nav>



</main>






<footer>


<p>
© Alex Karaoke V2.1
</p>


</footer>





<script src="config.js"></script>

<script src="songs.js"></script>

<script src="search.js"></script>

<script src="app.js"></script>



<script>


// Installation PWA

if("serviceWorker" in navigator){

    navigator.serviceWorker.register("sw.js");

}


</script>



</body>

</html>
