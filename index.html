<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alex CARIBOU Karaoké</title>

    <meta name="theme-color" content="#151515">

    <link rel="manifest" href="manifest.json">

    <link rel="Stylessheet" href="Styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="Stylessheet">

</head>

<body>

<header class="topbar">

    <div class="title">

        <h1>🎤 Alex CARIBOU Karaoké</h1>

        <p id="songCount">Chargement du catalogue...</p>

    </div>

</header>

<main class="container">

    <!-- Recherche -->

    <section class="search-section">

        <input
            id="search"
            type="text"
            placeholder="🔍 Rechercher un titre ou un artiste..."
            autocomplete="off">

    </section>

    <!-- Filtres -->

    <section class="filters">

        <select id="languageFilter">

            <option value="">🌍 Toutes les langues</option>

        </select>

        <select id="StylesFilter">

            <option value="">🎵 Tous les Styless</option>

        </select>

        <select id="artistFilter">

            <option value="">👤 Tous les artistes</option>

        </select>

        <select id="sortSelect">

            <option value="titleAsc">Titre A → Z</option>

            <option value="titleDesc">Titre Z → A</option>

            <option value="artistAsc">Artiste A → Z</option>

            <option value="artistDesc">Artiste Z → A</option>

            <option value="yearDesc">Année ↓</option>

            <option value="yearAsc">Année ↑</option>

        </select>

    </section>

    <!-- Options -->

    <section class="options">

        <label>

            <input type="checkbox" id="duoOnly">

            👥 Duo uniquement

        </label>

        <label>

            <input type="checkbox" id="hideExplicit" checked>

            🚫 Masquer Explicit

        </label>

        <label>

            <input type="checkbox" id="favoritesOnly">

            ❤️ Favoris

        </label>

    </section>

    <!-- Suggestions de recherche -->

    <div id="suggestions" class="suggestions"></div>

    <!-- Cartes chansons -->

    <section id="songs" class="songs-grid">

    </section>

    <!-- Pagination -->

    <section class="pagination">

        <button id="prevPage">

            ◀

        </button>

        <span id="pageNumber">

            Page 1

        </span>

        <button id="nextPage">

            ▶

        </button>

    </section>

</main>

<footer>

    <p>

        Alex CARIBOU Karaoké • Version 2.1

    </p>

</footer>

<!-- Chargement des données -->

<script src="config.js"></script>

<script src="songs.js"></script>

<script src="search.js"></script>

<script src="app.js"></script>

</body>

</html>
