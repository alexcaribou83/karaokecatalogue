<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Alex CARIBOU Karaoké</title>

    <meta
        name="theme-color"
        content="#1e1e1e">

    <meta
        name="description"
        content="Catalogue Karaoké Alex CARIBOU">

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<header class="topbar">

    <div class="logo">

        <h1>

            🎤 Alex CARIBOU Karaoké

        </h1>

        <p id="songCount">

            Chargement...

        </p>

    </div>

</header>

<main class="container">

    <!-- ========================= -->
    <!-- Recherche                 -->
    <!-- ========================= -->

    <section class="search-section">

        <input

            id="search"

            type="text"

            autocomplete="off"

            spellcheck="false"

            placeholder="🔍 Rechercher un titre, un artiste..."

        >

        <div

            id="suggestions"

            class="suggestions"

        ></div>

    </section>

    <!-- ========================= -->
    <!-- Ligne filtres             -->
    <!-- ========================= -->

    <section class="filters">

        <select id="languageFilter">

            <option value="">

                🌍 Toutes les langues

            </option>

        </select>

        <select id="styleFilter">

            <option value="">

                🎵 Tous les styles

            </option>

        </select>

        <select id="artistFilter">

            <option value="">

                👤 Tous les artistes

            </option>

        </select>

        <select id="sortSelect">

            <option value="titleAsc">

                Titre A → Z

            </option>

            <option value="titleDesc">

                Titre Z → A

            </option>

            <option value="artistAsc">

                Artiste A → Z

            </option>

            <option value="artistDesc">

                Artiste Z → A

            </option>

            <option value="yearDesc">

                Année ↓

            </option>

            <option value="yearAsc">

                Année ↑

            </option>

        </select>

    </section>

    <!-- ========================= -->
    <!-- Options                   -->
    <!-- ========================= -->

    <section class="options">

        <label>

            <input
                id="duoOnly"
                type="checkbox">

            👥 Duo uniquement

        </label>

        <label>

            <input
                id="hideExplicit"
                type="checkbox"
                checked>

            🚫 Masquer Explicit

        </label>

        <label>

            <input
                id="favoritesOnly"
                type="checkbox">

            ❤️ Favoris

        </label>

    </section>
        <!-- ========================= -->
    <!-- Résultats                 -->
    <!-- ========================= -->

    <section
        id="songs"
        class="songs-grid">

    </section>

    <!-- ========================= -->
    <!-- Pagination                -->
    <!-- ========================= -->

    <section class="pagination">

        <button
            id="prevPage"
            class="page-button">

            ◀ Précédent

        </button>

        <span
            id="pageNumber">

            Page 1 / 1

        </span>

        <button
            id="nextPage"
            class="page-button">

            Suivant ▶

        </button>

    </section>

</main>

<footer class="footer">

    <p>

        © Alex CARIBOU Karaoké
        <span id="appVersion">
            Version 3.0
        </span>

    </p>

</footer>

<!-- ========================= -->
<!-- Scripts                   -->
<!-- ========================= -->

<script src="config.js"></script>

<script src="songs.js"></script>

<script src="search.js"></script>

<script src="app.js"></script>

<script>

if("serviceWorker" in navigator){

    window.addEventListener(

        "load",

        ()=>{

            navigator.serviceWorker.register(

                "./sw.js"

            )

            .then(()=>{

                console.log(

                    "Service Worker chargé"

                );

            })

            .catch(error=>{

                console.error(

                    error

                );

            });

        }

    );

}

</script>

</body>

</html>
